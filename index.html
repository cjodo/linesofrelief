<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
    <meta name="theme-color" content="#191724" />
    <!-- seo -->
    <!-- /seo -->
    <!-- analytics -->
    <!-- /analytics -->
    <!-- Linked, not imported from JS, so it blocks first paint in dev as well as in builds. -->
    <link rel="stylesheet" href="/src/style.css" />
    <link rel="preload" href="/src/fonts/serif-italic.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="preload" href="/src/fonts/mono.woff2" as="font" type="font/woff2" crossorigin />
    <style>
      html { background: #191724; color: #e0def4; color-scheme: dark; }
    </style>
    <script>
      // A link to other coordinates or another zoom must not flash this page's
      // pre-rendered map (drawn at the default zoom).
      if (/[?&](lat|z)=/.test(location.search)) document.documentElement.classList.add('elsewhere');
      // The reader's text size, before first paint (see src/textsize.ts).
      try {
        var t = Number(localStorage.getItem('topography:text-scale'));
        if ([1.1, 1.2, 1.3].indexOf(t) >= 0) document.documentElement.style.setProperty('--text-scale', t);
      } catch (e) {}
    </script>
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%27http://www.w3.org/2000/svg%27 viewBox=%270 0 32 32%27%3E%3Crect width=%2732%27 height=%2732%27 rx=%276%27 fill=%27%23191724%27/%3E%3Cg fill=%27none%27 stroke-width=%271.6%27%3E%3Cellipse cx=%2716%27 cy=%2717%27 rx=%2712%27 ry=%279%27 stroke=%27%239ccfd8%27/%3E%3Cellipse cx=%2716%27 cy=%2716%27 rx=%277.5%27 ry=%275.5%27 stroke=%27%23c4a7e7%27/%3E%3Cellipse cx=%2716%27 cy=%2715%27 rx=%273%27 ry=%272.2%27 stroke=%27%23f6c177%27/%3E%3C/g%3E%3C/svg%3E" />
  </head>
  <body>
    <!-- prerender -->
    <!-- /prerender -->
    <p class="sr-only"><!-- about --><!-- /about --></p>
    <noscript>
      <p class="noscript">Topography draws its contour maps in the browser and needs JavaScript.</p>
    </noscript>
    <div class="loading-bar" aria-hidden="true"></div>
    <canvas id="preview" aria-hidden="true"></canvas>
    <canvas id="map" aria-label="Contour map of terrain elevation"></canvas>
    <div class="vignette" aria-hidden="true"></div>
    <div class="grain" aria-hidden="true"></div>
    <aside id="legend" class="legend"></aside>
    <aside id="collection" class="collection" aria-label="Museums"></aside>
    <aside id="museum-card" class="museum-card" aria-label="Museum" aria-live="polite"></aside>
    <aside class="locator" aria-label="Where you are">
      <p id="region" class="region empty" aria-live="polite"></p>
      <p class="coords"><span class="pulse" aria-hidden="true"></span><input
          id="coords"
          class="coord-entry"
          type="text"
          inputmode="text"
          enterkeyhint="go"
          spellcheck="false"
          autocomplete="off"
          aria-label="Coordinates of the centre; type new ones to go there"
          title="Type coordinates to go there"
        /></p>
      <div class="zoombar">
        <span class="scalebar" aria-hidden="true"><span></span></span>
        <button id="zoom-out" class="zoom" type="button" aria-label="Zoom out" title="Zoom out (−)">
          <svg viewBox="0 0 16 16" aria-hidden="true"><path d="M3.5 8h9" /></svg>
        </button>
        <button id="zoom-in" class="zoom" type="button" aria-label="Zoom in" title="Zoom in (+)">
          <svg viewBox="0 0 16 16" aria-hidden="true"><path d="M3.5 8h9M8 3.5v9" /></svg>
        </button>
      </div>
      <div class="minimap" aria-hidden="true">
        <canvas></canvas>
        <span class="you"></span>
      </div>
      <p class="credits">
        Elevation <a href="https://registry.opendata.aws/terrain-tiles/">Terrain Tiles</a> ·
        <a href="https://openfreemap.org">OpenFreeMap</a> ·
        <a href="https://www.openmaptiles.org/">© OpenMapTiles</a> ·
        <a href="https://www.openstreetmap.org/copyright">© OpenStreetMap</a>
        <span class="consent-link"> · <a href="#" data-consent>Cookies</a></span>
      </p>
    </aside>
    <nav class="nav" aria-label="Site">
      <a class="brand" href="/" aria-current="page">Topography</a>
      <a href="/mountains/">Summits</a>
      <!-- favorites -->
      <!-- /favorites -->
      <div class="textsize" role="radiogroup" aria-label="Text size" title="Text size">
        <button type="button" role="radio" data-scale="1" aria-label="Default text size">a</button>
        <button type="button" role="radio" data-scale="1.1" aria-label="Larger text">a</button>
        <button type="button" role="radio" data-scale="1.2" aria-label="Large text">A</button>
        <button type="button" role="radio" data-scale="1.3" aria-label="Largest text">A</button>
      </div>
    </nav>
    <form id="search" class="search" role="search" onsubmit="return false">
      <svg class="glass" viewBox="0 0 16 16" aria-hidden="true"><circle cx="7" cy="7" r="4.5" /><path d="M10.5 10.5 14 14" /></svg>
      <input
        type="search"
        placeholder="Find a peak, lake, town or country"
        aria-label="Find a peak, lake, town or country, or go to coordinates"
        title="A place, or coordinates like 51.18, -115.57"
        role="combobox"
        aria-autocomplete="list"
        aria-controls="results"
        aria-expanded="false"
        autocomplete="off"
        spellcheck="false"
      />
      <kbd aria-hidden="true">/</kbd>
      <ul id="results" role="listbox" hidden></ul>
    </form>
    <button id="export" class="share export" type="button" aria-label="Export this view as PNG" title="Export this view as PNG" disabled>
      <svg viewBox="0 0 16 16" aria-hidden="true">
        <path d="M8 2v8.5M4.75 7.25 8 10.5l3.25-3.25M3 13.5h10" />
      </svg>
    </button>
    <button id="share" class="share" type="button" aria-label="Share this view" title="Share this view">
      <svg viewBox="0 0 16 16" aria-hidden="true">
        <path d="M8 10.5V2M4.75 5.25 8 2l3.25 3.25M3 8.5v5h10v-5" />
      </svg>
      <span class="toast" role="status"></span>
    </button>
    <div id="discovery" class="discovery" role="status" aria-live="polite" hidden>
      <p class="eyebrow"></p>
      <h2 class="name"></h2>
      <p class="detail"></p>
    </div>
    <section id="intro" class="intro" role="status" aria-live="polite">
      <h1 class="place"></h1>
      <p class="detail"></p>
      <p class="where"></p>
      <div class="track"><div class="fill"></div></div>
      <p class="status">Surveying</p>
    </section>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
