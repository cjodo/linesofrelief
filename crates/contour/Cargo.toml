[package]
name = "contour"
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"

[lib]
crate-type = ["cdylib"]

[[bin]]
name = "profile"
path = "profile.rs"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
debug = true

[[bench]]
name = "contour_benchmark"
harness = false

[dependencies]
rayon = "1.12.0"

[dev-dependencies]
criterion = { version = "0.8.2", features = ["rayon"] }
